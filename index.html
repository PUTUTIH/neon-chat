<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a">
  <title>NEON CHAT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0a0a1a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* LUCES DE FONDO */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,0,200,0.35), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(0,200,255,0.35), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(150,0,255,0.35), transparent 40%);
      animation: luces 8s infinite alternate;
      z-index: -1;
    }
    @keyframes luces {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(90deg); }
    }

    /* HEADER */
    header {
      padding: 15px 20px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,0,200,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.3rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff00c8, #00e5ff, #a200ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brillo 4s infinite;
    }
    @keyframes brillo {
      0%,100% { background-position: 0% 50%; }
      50%     { background-position: 100% 50%; }
    }
    header .estado {
      font-size: 0.8rem;
      color: #00e5ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header .punto {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
      animation: parpadeo 1.5s infinite;
    }
    @keyframes parpadeo {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.3; }
    }

    /* CHAT */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: #ff00c8; border-radius: 3px; }

    /* MENSAJES */
    .msg {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 18px;
      animation: aparecer 0.3s ease;
      word-wrap: break-word;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg .nombre {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .msg .texto { font-size: 0.95rem; line-height: 1.4; }
    .msg .hora {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }
    .msg.yo {
      align-self: flex-end;
      background: linear-gradient(135deg, #ff00c8, #a200ff);
      box-shadow: 0 0 15px rgba(255,0,200,0.5);
    }
    .msg.yo .nombre { color: #fff; }
    .msg.sistema {
      align-self: center;
      background: rgba(0,0,0,0.4);
      color: #aaa;
      font-size: 0.8rem;
      font-style: italic;
      padding: 6px 14px;
      border-radius: 20px;
      text-align: center;
    }

    /* INPUT */
    .input-area {
      display: flex;
      padding: 12px 15px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,0,200,0.4);
      gap: 8px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255,0,200,0.5);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 16px; /* 16px evita zoom en iPhone */
      outline: none;
      transition: 0.3s;
      min-width: 0;
    }
    .input-area input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 15px rgba(0,229,255,0.5);
    }
    .input-area input::placeholder { color: #888; }
    .input-area button {
      padding: 12px 20px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(90deg, #ff00c8, #a200ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,200,0.5);
      transition: 0.3s;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .input-area button:active {
      transform: scale(0.95);
    }

    /* BOTÓN MÚSICA */
    .musica-btn {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff00c8, #a200ff);
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 0 20px #ff00c8;
      z-index: 200;
      transition: 0.3s;
    }
    .musica-btn:active { transform: scale(0.9); }

    /* MODAL NOMBRE */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 20px;
    }
    .modal.oculto { display: none; }
    .modal-box {
      background: rgba(20,20,40,0.95);
      border: 1px solid rgba(255,0,200,0.6);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,0,200,0.5);
      max-width: 380px;
      width: 100%;
    }
    .modal-box h2 {
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ff00c8, #00e5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }
    .modal-box p { color: #aaa; margin-bottom: 25px; font-size: 0.9rem; }
    .modal-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255,0,200,0.5);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
      text-align: center;
    }
    .modal-box input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 15px rgba(0,229,255,0.5);
    }
    .modal-box button {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(90deg, #ff00c8, #a200ff);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .modal-box button:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <div class="modal" id="modalNombre">
    <div class="modal-box">
      <h2>NEON CHAT</h2>
      <p>Entra en la sala 💜</p>
      <input type="text" id="inputNombre" placeholder="Tu nombre..." maxlength="15" autocomplete="off">
      <button onclick="entrar()">Entrar</button>
    </div>
  </div>

  <header>
    <h1>NEON CHAT</h1>
    <div class="estado">
      <span class="punto"></span>
      <span id="numUsuarios">Sala en vivo</span>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input type="text" id="inputMensaje" placeholder="Escribe..." maxlength="300" disabled autocomplete="off">
    <button onclick="enviar()" id="btnEnviar" disabled>➤</button>
  </div>

  <button class="musica-btn" onclick="toggleMusica()" id="btnMusica">🎵</button>

  <audio id="audioFondo" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
  </audio>

  <script>
    let nombreUsuario = "";
    const chat = document.getElementById('chat');

    function entrar() {
      const input = document.getElementById('inputNombre');
      const nombre = input.value.trim();
      if (!nombre) {
        input.style.borderColor = '#ff0055';
        return;
      }
      nombreUsuario = nombre;
      document.getElementById('modalNombre').classList.add('oculto');
      document.getElementById('inputMensaje').disabled = false;
      document.getElementById('btnEnviar').disabled = false;

      agregarMensaje('sistema', '', `Te has unido como ${nombreUsuario} ✨`);
    }

    function enviar() {
      const input = document.getElementById('inputMensaje');
      const texto = input.value.trim();
      if (!texto) return;
      agregarMensaje('yo', nombreUsuario, texto);
      input.value = '';
      input.focus();
    }

    function agregarMensaje(tipo, nombre, texto) {
      const div = document.createElement('div');
      div.className = 'msg ' + tipo;
      const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

      if (tipo === 'sistema') {
        div.textContent = texto;
      } else {
        div.innerHTML = `
          <div class="nombre">${nombre}</div>
          <div class="texto">${escapeHtml(texto)}</div>
          <div class="hora">${hora}</div>
        `;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    document.getElementById('inputMensaje').addEventListener('keypress', e => {
      if (e.key === 'Enter') enviar();
    });
    document.getElementById('inputNombre').addEventListener('keypress', e => {
      if (e.key === 'Enter') entrar();
    });

    function toggleMusica() {
      const audio = document.getElementById('audioFondo');
      const btn = document.getElementById('btnMusica');
      if (audio.paused) {
        audio.play();
        btn.textContent = '🔊';
      } else {
        audio.pause();
        btn.textContent = '🎵';
      }
    }
  </script>

</body>
</html>
