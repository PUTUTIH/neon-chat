<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON CHAT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0a0a1a; color: white;
      display: flex; flex-direction: column; height: 100dvh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,0,200,0.35), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(0,200,255,0.35), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(150,0,255,0.35), transparent 40%);
      animation: luces 8s infinite alternate; z-index: -1;
    }
    @keyframes luces { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(90deg)} }

    header {
      padding: 12px 15px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,0,200,0.4);
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; gap: 8px;
    }
    header h1 {
      font-size: 1.1rem; letter-spacing: 2px;
      background: linear-gradient(90deg,#ff00c8,#00e5ff,#a200ff);
      background-size: 300% 300%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: brillo 4s infinite;
    }
    @keyframes brillo { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    .sala-btn {
      font-size: 0.75rem; color: #00e5ff;
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.4);
      padding: 5px 10px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; transition: 0.3s;
      font-family: monospace;
      letter-spacing: 2px;
    }
    .sala-btn:active { transform: scale(0.95); }

    .chat {
      flex: 1; overflow-y: auto; padding: 15px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: #ff00c8; border-radius: 3px; }

    .msg {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      animation: aparecer 0.3s ease; word-wrap: break-word;
    }
    @keyframes aparecer { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .msg .nombre { font-size: 0.72rem; font-weight: bold; margin-bottom: 4px; }
    .msg .texto { font-size: 0.95rem; line-height: 1.4; }
    .msg .hora { font-size: 0.65rem; opacity: 0.6; margin-top: 4px; text-align: right; }
    .msg.otro { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,229,255,0.4); }
    .msg.otro .nombre { color: #00e5ff; }
    .msg.yo { align-self: flex-end; background: linear-gradient(135deg,#ff00c8,#a200ff); box-shadow: 0 0 15px rgba(255,0,200,0.5); }
    .msg.yo .nombre { color: #fff; }
    .msg.sistema {
      align-self: center; background: rgba(0,0,0,0.4);
      color: #aaa; font-size: 0.78rem; font-style: italic;
      padding: 6px 14px; border-radius: 20px; text-align: center;
      max-width: 90%;
    }
    .msg.sistema.error { color: #ff5577; border: 1px solid rgba(255,0,100,0.4); }
    .msg.sistema.ok { color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }

    .input-area {
      display: flex; padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,0,200,0.4);
      gap: 8px; flex-shrink: 0;
    }
    .input-area input {
      flex: 1; padding: 12px 16px; border-radius: 30px;
      border: 1px solid rgba(255,0,200,0.5);
      background: rgba(255,255,255,0.05);
      color: white; font-size: 16px; outline: none;
      min-width: 0;
    }
    .input-area input:focus { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
    .input-area input::placeholder { color: #888; }
    .input-area input:disabled { opacity: 0.4; }
    .input-area button {
      padding: 12px 18px; border-radius: 30px; border: none;
      background: linear-gradient(90deg,#ff00c8,#a200ff);
      color: white; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,200,0.5);
      font-size: 1rem; flex-shrink: 0;
    }
    .input-area button:active { transform: scale(0.95); }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 999;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 20px;
    }
    .modal.oculto { display: none; }
    .modal-box {
      background: rgba(20,20,40,0.97);
      border: 1px solid rgba(255,0,200,0.6);
      border-radius: 20px; padding: 30px 22px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,0,200,0.5);
      max-width: 400px; width: 100%;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-box h2 {
      margin-bottom: 8px;
      background: linear-gradient(90deg,#ff00c8,#00e5ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-size: 1.6rem; letter-spacing: 2px;
    }
    .modal-box p { color: #aaa; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.4; }

    .opcion {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 16px; margin-bottom: 12px;
      border-radius: 15px; border: 2px solid transparent;
      background: rgba(255,255,255,0.05);
      color: white; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.3s;
      text-align: left;
    }
    .opcion:hover, .opcion:active {
      border-color: #ff00c8;
      background: rgba(255,0,200,0.1);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255,0,200,0.3);
    }
    .opcion .icono { font-size: 1.6rem; }
    .opcion .texto-op { flex: 1; }
    .opcion .titulo-op { color: #00e5ff; font-size: 0.95rem; }
    .opcion .desc-op { color: #888; font-size: 0.72rem; font-weight: normal; margin-top: 3px; }

    .modal-box label { display: block; text-align: left; color: #00e5ff; font-size: 0.78rem; margin-bottom: 6px; margin-top: 12px; }
    .modal-box input {
      width: 100%; padding: 13px 16px; border-radius: 30px;
      border: 1px solid rgba(255,0,200,0.5);
      background: rgba(255,255,255,0.05);
      color: white; font-size: 16px; outline: none;
      text-align: center;
    }
    .modal-box input:focus { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
    .modal-box .btn-principal {
      width: 100%; padding: 14px; border-radius: 30px; border: none;
      background: linear-gradient(90deg,#ff00c8,#a200ff);
      color: white; font-weight: bold; font-size: 1rem;
      cursor: pointer; letter-spacing: 1px;
      margin-top: 18px;
    }
    .modal-box .btn-principal:active { transform: scale(0.97); }
    .modal-box .btn-secundario {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,0,200,0.4);
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .codigo-grande {
      font-family: monospace;
      font-size: 2.2rem;
      letter-spacing: 8px;
      color: #00e5ff;
      background: rgba(0,229,255,0.1);
      border: 2px dashed #00e5ff;
      padding: 18px;
      border-radius: 12px;
      margin: 15px 0;
      text-shadow: 0 0 15px #00e5ff;
      user-select: all;
      font-weight: bold;
    }
    .aviso { font-size: 0.78rem; color: #ff00c8; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>

  <!-- MODAL BIENVENIDA -->
  <div class="modal" id="modalInicio">
    <div class="modal-box">
      <h2>NEON CHAT</h2>
      <p>¿Qué quieres hacer?</p>

      <button class="opcion" onclick="mostrarCrear()">
        <span class="icono">🔑</span>
        <span class="texto-op">
          <div class="titulo-op">Crear un código</div>
          <div class="desc-op">Genera un código de 6 dígitos y pásalo a tus amigos</div>
        </span>
      </button>

      <button class="opcion" onclick="mostrarUnirse()">
        <span class="icono">🔒</span>
        <span class="texto-op">
          <div class="titulo-op">Unirme con código</div>
          <div class="desc-op">Ya tienes un código de un amigo</div>
        </span>
      </button>

      <button class="opcion" onclick="mostrarPublica()">
        <span class="icono">🌍</span>
        <span class="texto-op">
          <div class="titulo-op">Sala pública</div>
          <div class="desc-op">Habla con todo el mundo</div>
        </span>
      </button>
    </div>
  </div>

  <!-- MODAL CREAR CÓDIGO -->
  <div class="modal oculto" id="modalCrear">
    <div class="modal-box">
      <h2>CREAR CÓDIGO</h2>
      <p>Tu código de 6 dígitos para invitar amigos</p>

      <label>Tu nombre</label>
      <input type="text" id="nombreCrear" placeholder="Ej: María" maxlength="15" autocomplete="off">

      <label>Tu código (6 dígitos)</label>
      <input type="tel" id="codigoCrear" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="letter-spacing: 6px; font-size: 1.4rem; font-weight: bold;">

      <button class="btn-principal btn-secundario" onclick="generarCodigoAleatorio()" style="margin-top: 8px;">
        🎲 Generar código aleatorio
      </button>

      <button class="btn-principal" onclick="crearSala()">Crear y entrar 🔑</button>
      <button class="btn-principal btn-secundario" onclick="volverInicio()">← Volver</button>

      <p class="aviso" id="avisoCrear"></p>
    </div>
  </div>

  <!-- MODAL UNIRSE -->
  <div class="modal oculto" id="modalUnirse">
    <div class="modal-box">
      <h2>UNIRME</h2>
      <p>Escribe el código que te pasó tu amigo</p>

      <label>Tu nombre</label>
      <input type="text" id="nombreUnir" placeholder="Ej: Carlos" maxlength="15" autocomplete="off">

      <label>Código de la sala (6 dígitos)</label>
      <input type="tel" id="codigoUnir" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="letter-spacing: 6px; font-size: 1.4rem; font-weight: bold;">

      <button class="btn-principal" onclick="unirSala()">Entrar 🔒</button>
      <button class="btn-principal btn-secundario" onclick="volverInicio()">← Volver</button>

      <p class="aviso" id="avisoUnir"></p>
    </div>
  </div>

  <!-- MODAL SALA PÚBLICA -->
  <div class="modal oculto" id="modalPublica">
    <div class="modal-box">
      <h2>SALA PÚBLICA</h2>
      <p>Todos los que entren aquí se ven entre sí</p>

      <label>Tu nombre</label>
      <input type="text" id="nombrePublica" placeholder="Ej: Ana" maxlength="15" autocomplete="off">

      <button class="btn-principal" onclick="entrarPublica()">Entrar 🌍</button>
      <button class="btn-principal btn-secundario" onclick="volverInicio()">← Volver</button>

      <p class="aviso" id="avisoPublica"></p>
    </div>
  </div>

  <!-- MODAL COMPARTIR CÓDIGO -->
  <div class="modal oculto" id="modalCompartir">
    <div class="modal-box">
      <h2>TU CÓDIGO</h2>
      <p>Pásaselo a tus amigos para que entren a tu sala</p>

      <div class="codigo-grande" id="codigoMostrado">------</div>

      <button class="btn-principal" onclick="copiarCodigo()">📋 Copiar código</button>
      <button class="btn-principal btn-secundario" onclick="compartirWhatsApp()">📱 Compartir por WhatsApp</button>
      <button class="btn-principal btn-secundario" onclick="cerrarCompartir()">Cerrar</button>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <h1>NEON CHAT</h1>
    <div class="sala-btn" onclick="abrirCompartir()">
      🔑 <span id="codigoHeader">------</span>
    </div>
  </header>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input type="text" id="inputMensaje" placeholder="Escribe..." maxlength="300" disabled autocomplete="off">
    <button onclick="enviar()" id="btnEnviar" disabled>➤</button>
  </div>

  <script>
    // ============================================================
    // VARIABLES GLOBALES
    // ============================================================
    let nombreUsuario = "";
    let codigoSala = "";
    let esSalaPublica = false;
    let firebaseListo = false;
    let fb = {};
    let mensajesVistos = new Set(); // para no duplicar

    const chat = document.getElementById('chat');

    // ============================================================
    // NAVEGACIÓN DE MODALES
    // ============================================================
    function cerrarTodo() {
      document.querySelectorAll('.modal').forEach(m => m.classList.add('oculto'));
    }

    window.volverInicio = () => { cerrarTodo(); document.getElementById('modalInicio').classList.remove('oculto'); };
    window.mostrarCrear = () => { cerrarTodo(); document.getElementById('modalCrear').classList.remove('oculto'); };
    window.mostrarUnirse = () => { cerrarTodo(); document.getElementById('modalUnirse').classList.remove('oculto'); };
    window.mostrarPublica = () => { cerrarTodo(); document.getElementById('modalPublica').classList.remove('oculto'); };

    // ============================================================
    // GENERAR CÓDIGO ALEATORIO
    // ============================================================
    window.generarCodigoAleatorio = function() {
      const codigo = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('codigoCrear').value = codigo;
    };

    // ============================================================
    // CREAR SALA
    // ============================================================
    window.crearSala = function() {
      const nombre = document.getElementById('nombreCrear').value.trim();
      const codigo = document.getElementById('codigoCrear').value.trim();
      const aviso = document.getElementById('avisoCrear');

      if (!nombre) { aviso.textContent = "⚠️ Escribe tu nombre"; return; }
      if (!codigo) { aviso.textContent = "⚠️ Escribe o genera un código"; return; }
      if (!/^\d{6}$/.test(codigo)) { aviso.textContent = "⚠️ El código debe ser exactamente 6 dígitos"; return; }

      nombreUsuario = nombre;
      codigoSala = "privada-" + codigo;
      esSalaPublica = false;

      entrarAlChat(`Has creado la sala "${codigo}" 🔑`);
      setTimeout(() => abrirCompartir(), 600);
    };

    // ============================================================
    // UNIRSE CON CÓDIGO
    // ============================================================
    window.unirSala = function() {
      const nombre = document.getElementById('nombreUnir').value.trim();
      const codigo = document.getElementById('codigoUnir').value.trim();
      const aviso = document.getElementById('avisoUnir');

      if (!nombre) { aviso.textContent = "⚠️ Escribe tu nombre"; return; }
      if (!codigo) { aviso.textContent = "⚠️ Escribe el código"; return; }
      if (!/^\d{6}$/.test(codigo)) { aviso.textContent = "⚠️ El código debe ser 6 dígitos"; return; }

      nombreUsuario = nombre;
      codigoSala = "privada-" + codigo;
      esSalaPublica = false;

      entrarAlChat(`Te has unido a la sala "${codigo}" 🔒`);
    };

    // ============================================================
    // SALA PÚBLICA
    // ============================================================
    window.entrarPublica = function() {
      const nombre = document.getElementById('nombrePublica').value.trim();
      const aviso = document.getElementById('avisoPublica');

      if (!nombre) { aviso.textContent = "⚠️ Escribe tu nombre"; return; }

      nombreUsuario = nombre;
      codigoSala = "publica";
      esSalaPublica = true;

      entrarAlChat(`Estás en la sala pública 🌍`);
    };

    // ============================================================
    // ENVIAR MENSAJE
    // ============================================================
    window.enviar = function() {
      const input = document.getElementById('inputMensaje');
      const texto = input.value.trim();

      if (!texto) return;
      if (!codigoSala) {
        agregarMensaje('sistema error', '', '⚠️ Primero entra a una sala');
        return;
      }

      // Guardamos localmente el texto para no duplicarlo cuando vuelva de Firebase
      const textoLocal = texto;

      if (firebaseListo && fb.push) {
        fb.push(fb.ref(fb.db, 'mensajes/' + codigoSala), {
          nombre: nombreUsuario,
          texto: texto,
          hora: fb.serverTimestamp()
        }).catch(err => {
          console.error("Error al enviar:", err);
          agregarMensaje('sistema error', '', '❌ Error al enviar: ' + err.message);
        });
      } else {
        // Sin Firebase, solo local
        agregarMensaje('yo', nombreUsuario, textoLocal);
      }

      input.value = '';
      input.focus();
    };

    // ============================================================
    // COMPARTIR CÓDIGO
    // ============================================================
    window.abrirCompartir = function() {
      if (esSalaPublica || !codigoSala) {
        alert("Estás en la sala pública. Crea un código para tener una sala privada.");
        return;
      }
      const codigo = codigoSala.replace('privada-', '');
      document.getElementById('codigoMostrado').textContent = codigo;
      cerrarTodo();
      document.getElementById('modalCompartir').classList.remove('oculto');
    };

    window.cerrarCompartir = () => document.getElementById('modalCompartir').classList.add('oculto');

    window.copiarCodigo = function() {
      const codigo = document.getElementById('codigoMostrado').textContent;
      navigator.clipboard.writeText(codigo).then(() => {
        alert("✅ Código copiado: " + codigo);
      }).catch(() => {
        alert("Copia manualmente: " + codigo);
      });
    };

    window.compartirWhatsApp = function() {
      const codigo = document.getElementById('codigoMostrado').textContent;
      const url = window.location.href;
      const mensaje = `¡Únete a mi chat en NEON CHAT! 💜\n\nCódigo: *${codigo}*\n\nAbre este enlace y pon el código:\n${url}`;
      window.open('https://wa.me/?text=' + encodeURIComponent(mensaje), '_blank');
    };

    // ============================================================
    // ENTRAR AL CHAT
    // ============================================================
    function entrarAlChat(mensajeSistema) {
      cerrarTodo();
      document.getElementById('inputMensaje').disabled = false;
      document.getElementById('btnEnviar').disabled = false;
      document.getElementById('codigoHeader').textContent =
        esSalaPublica ? "PÚBLICA" : codigoSala.replace('privada-', '');

      agregarMensaje('sistema', '', mensajeSistema);

      if (!firebaseListo) {
        agregarMensaje('sistema error', '', '⚠️ Firebase no configurado: los mensajes solo se ven en tu pantalla');
        return;
      }

      agregarMensaje('sistema ok', '', '✅ Conectado en tiempo real');
      iniciarEscucha();
    }

    // ============================================================
    // ESCUCHAR MENSAJES (mejorado)
    // ============================================================
    function iniciarEscucha() {
      if (!firebaseListo || !fb.onChildAdded) return;

      mensajesVistos.clear();

      const mensajesRef = fb.query(
        fb.ref(fb.db, 'mensajes/' + codigoSala),
        fb.limitToLast(100)
      );

      fb.onChildAdded(mensajesRef, (snapshot) => {
        const key = snapshot.key;
        const data = snapshot.val();
        if (!data) return;
        if (mensajesVistos.has(key)) return;
        mensajesVistos.add(key);

        const tipo = data.nombre === nombreUsuario ? 'yo' : 'otro';

        // Si es mi propio mensaje, no lo duplicamos (ya se ve al enviarlo)
        if (tipo === 'yo') {
          const ultimo = chat.lastElementChild;
          if (ultimo && ultimo.classList.contains('yo')) {
            const textoPantalla = ultimo.querySelector('.texto')?.textContent;
            if (textoPantalla === data.texto) return;
          }
        }

        agregarMensaje(tipo, data.nombre, data.texto);
      });

      console.log("👂 Escuchando mensajes en sala:", codigoSala);
    }

    // ============================================================
    // RENDER MENSAJES
    // ============================================================
    function agregarMensaje(tipo, nombre, texto) {
      const div = document.createElement('div');
      div.className = 'msg ' + tipo;
      const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

      if (tipo.startsWith('sistema')) {
        div.textContent = texto;
      } else {
        div.innerHTML = `
          <div class="nombre">${escapeHtml(nombre)}</div>
          <div class="texto">${escapeHtml(texto)}</div>
          <div class="hora">${hora}</div>
        `;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    document.getElementById('inputMensaje').addEventListener('keypress', e => {
      if (e.key === 'Enter') window.enviar();
    });

    // ============================================================
    // CARGAR FIREBASE
    // ============================================================
    (async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
        const { getDatabase, ref, push, onChildAdded, serverTimestamp, query, limitToLast }
          = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

        const firebaseConfig = {
          apiKey: "AIzaSyCdZK6J0P1nvvLhKqI6zZfYp3QajSCybNo",
          authDomain: "neon-chat-5d3bc.firebaseapp.com",
          databaseURL: "https://neon-chat-5d3bc-default-rtdb.firebaseio.com",
          projectId: "neon-chat-5d3bc",
          storageBucket: "neon-chat-5d3bc.firebasestorage.app",
          messagingSenderId: "59021322456",
          appId: "1:59021322456:web:457414eb330ee8e22bcfad"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        fb = { db: database, ref, push, onChildAdded, serverTimestamp, query, limitToLast };
        firebaseListo = true;
        console.log("✅ Firebase conectado");

      } catch (e) {
        console.error("❌ Error al conectar Firebase:", e);
        firebaseListo = false;
      }
    })();
